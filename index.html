<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitTrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="constellation"></canvas>
  <header>
    <h1>FitTrack</h1>
    <span id="date"></span>
    <button id="logout" hidden>Sign out</button>
  </header>

  <!-- ================= Auth ================= -->
  <section id="auth">
    <div class="card">
      <h2 id="authTitle">Sign in</h2>
      <form id="authForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" minlength="6" required>
        </div>
        <button>Continue</button>
      </form>
      <button id="toggle">Create account</button>
      <p id="authMsg"></p>
    </div>
  </section>

  <!-- ================= App ================= -->
  <main id="app" hidden>

    <nav>
      <button data-page="dash">Dashboard</button>
      <button data-page="food">Food</button>
      <button data-page="workout">Workout</button>
      <button data-page="progress">Progress</button>
      <button data-page="settings">Settings</button>
    </nav>

    <!-- ---- Dashboard ---- -->
    <section id="dash" class="page">
      <div class="grid">
        <div class="card">
          <h2>Calories</h2>
          <div class="big"><b id="cal">0</b> / <span id="calGoal">1950</span> kcal</div>
          <div class="bar"><i id="calBar"></i></div>
        </div>
        <div class="card">
          <h2>Macros</h2>
          <div id="macros"></div>
        </div>
      </div>
      <div class="grid">
        <div class="card stat">Weight<br><b id="weightDash">73</b> kg</div>
        <div class="card stat">Steps<br><b id="stepsDash">0</b></div>
        <div class="card stat">Workout<br><b id="workoutDash">Rest</b></div>
      </div>
    </section>

    <!-- ---- Food ---- -->
    <section id="food" class="page" hidden>
      <div class="card">
        <h2>Scan / Add Food</h2>
        <button id="scan">📷 Scan barcode</button>
        <video id="video" playsinline hidden></video>
        <form id="foodForm">
          <div class="form-row">
            <label for="fname">Food name</label>
            <input id="fname" required>
          </div>
          <div class="form-row">
            <label for="serving">Serving</label>
            <input id="serving">
          </div>
          <div class="form-row">
            <label for="fcal">Calories</label>
            <input id="fcal" type="number" required>
          </div>
          <div class="form-row">
            <label for="fp">Protein (g)</label>
            <input id="fp" type="number" step=".1" required>
          </div>
          <div class="form-row">
            <label for="fc">Carbs (g)</label>
            <input id="fc" type="number" step=".1" required>
          </div>
          <div class="form-row">
            <label for="ff">Fat (g)</label>
            <input id="ff" type="number" step=".1" required>
          </div>
          <button>Add food</button>
        </form>
      </div>
      <div class="card">
        <h2>Today's food</h2>
        <div id="foodList"></div>
      </div>
    </section>

    <!-- ---- Workout ---- -->
    <section id="workout" class="page" hidden>
      <div class="card">
        <h2>PPL Workout</h2>
        <div class="ppl">
          <button data-ppl="Push">Push</button>
          <button data-ppl="Pull">Pull</button>
          <button data-ppl="Legs">Legs</button>
        </div>
        <form id="exForm">
          <div class="form-row">
            <label for="ename">Exercise</label>
            <input id="ename" required>
          </div>
          <div class="form-row">
            <label for="sets">Sets</label>
            <input id="sets" type="number" value="3">
          </div>
          <div class="form-row">
            <label for="reps">Reps</label>
            <input id="reps" type="number" value="10">
          </div>
          <div class="form-row">
            <label for="ew">Weight (kg)</label>
            <input id="ew" type="number" step=".5" value="0">
          </div>
          <button>Add exercise</button>
        </form>
        <button id="finish">Finish workout</button>
      </div>
      <div class="card">
        <div id="exList"></div>
      </div>
    </section>

    <!-- ---- Progress ---- -->
    <section id="progress" class="page" hidden>
      <div class="grid">
        <div class="card">
          <h2>Weight</h2>
          <form id="weightForm">
            <div class="form-row">
              <label for="weightInput">Weight (kg)</label>
              <input id="weightInput" type="number" step=".1" required>
            </div>
            <button>Save weight</button>
          </form>
        </div>
        <div class="card">
          <h2>Steps</h2>
          <form id="stepsForm">
            <div class="form-row">
              <label for="stepsInput">Steps</label>
              <input id="stepsInput" type="number" required>
            </div>
            <button>Save steps</button>
          </form>
        </div>
      </div>
      <div class="card">
        <h2>History</h2>
        <div id="history"></div>
      </div>
    </section>

    <!-- ---- Settings ---- -->
    <section id="settings" class="page" hidden>
      <div class="card">
        <h2>Goals</h2>
        <form id="settingsForm">
          <div class="form-row">
            <label for="age">Age</label>
            <input id="age" type="number">
          </div>
          <div class="form-row">
            <label for="height">Height (cm)</label>
            <input id="height" type="number">
          </div>
          <div class="form-row">
            <label for="goalCal">Calories</label>
            <input id="goalCal" type="number">
          </div>
          <div class="form-row">
            <label for="goalP">Protein (g)</label>
            <input id="goalP" type="number">
          </div>
          <div class="form-row">
            <label for="goalC">Carbs (g)</label>
            <input id="goalC" type="number">
          </div>
          <div class="form-row">
            <label for="goalF">Fat (g)</label>
            <input id="goalF" type="number">
          </div>
          <div class="form-row">
            <label for="goalSteps">Steps</label>
            <input id="goalSteps" type="number">
          </div>
          <button>Save</button>
        </form>
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
