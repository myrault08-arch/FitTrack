<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitTrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="constellation"></canvas>
  <header>
    <h1>FitTrack</h1>
    <span id="date"></span>
    <button id="logout" hidden>Sign out</button>
  </header>

  <!-- ================= Auth ================= -->
  <section id="auth">
    <div class="card">
      <h2 id="authTitle">Sign in</h2>
      <form id="authForm">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" minlength="6" required>
        <button>Continue</button>
      </form>
      <button id="toggle">Create account</button>
      <p id="authMsg"></p>
    </div>
  </section>

  <!-- ================= App ================= -->
  <main id="app" hidden>

    <nav>
      <button data-page="dash">Dashboard</button>
      <button data-page="food">Food</button>
      <button data-page="workout">Workout</button>
      <button data-page="progress">Progress</button>
      <button data-page="settings">Settings</button>
    </nav>

    <!-- ---- Dashboard ---- -->
    <section id="dash" class="page">
      <div class="grid">
        <div class="card">
          <h2>Calories</h2>
          <div class="big"><b id="cal">0</b> / <span id="calGoal">1950</span> kcal</div>
          <div class="bar"><i id="calBar"></i></div>
        </div>
        <div class="card">
          <h2>Macros</h2>
          <div id="macros"></div>
        </div>
      </div>
      <div class="grid">
        <div class="card stat">Weight<br><b id="weightDash">73</b> kg</div>
        <div class="card stat">Steps<br><b id="stepsDash">0</b></div>
        <div class="card stat">Workout<br><b id="workoutDash">Rest</b></div>
      </div>
    </section>

    <!-- ---- Food ---- -->
    <section id="food" class="page" hidden>
      <div class="card">
        <h2>Scan / Add Food</h2>
        <button id="scan">📷 Scan barcode</button>
        <video id="video" playsinline hidden></video>
        <form id="foodForm">
          <input id="fname" placeholder="Food name" required>
          <input id="serving" placeholder="Serving">
          <input id="fcal" type="number" placeholder="Calories" required>
          <input id="fp" type="number" step=".1" placeholder="Protein g" required>
          <input id="fc" type="number" step=".1" placeholder="Carbs g" required>
          <input id="ff" type="number" step=".1" placeholder="Fat g" required>
          <button>Add food</button>
        </form>
      </div>
      <div class="card">
        <h2>Today's food</h2>
        <div id="foodList"></div>
      </div>
    </section>

    <!-- ---- Workout ---- -->
    <section id="workout" class="page" hidden>
      <div class="card">
        <h2>PPL Workout</h2>
        <div class="ppl">
          <button data-ppl="Push">Push</button>
          <button data-ppl="Pull">Pull</button>
          <button data-ppl="Legs">Legs</button>
        </div>
        <form id="exForm">
          <input id="ename" placeholder="Exercise" required>
          <input id="sets" type="number" value="3" placeholder="Sets">
          <input id="reps" type="number" value="10" placeholder="Reps">
          <input id="ew" type="number" step=".5" value="0" placeholder="Weight kg">
          <button>Add exercise</button>
        </form>
        <button id="finish">Finish workout</button>
      </div>
      <div class="card">
        <div id="exList"></div>
      </div>
    </section>

    <!-- ---- Progress ---- -->
    <section id="progress" class="page" hidden>
      <div class="grid">
        <div class="card">
          <h2>Weight</h2>
          <form id="weightForm">
            <input id="weightInput" type="number" step=".1" required>
            <button>Save weight</button>
          </form>
        </div>
        <div class="card">
          <h2>Steps</h2>
          <form id="stepsForm">
            <input id="stepsInput" type="number" required>
            <button>Save steps</button>
          </form>
        </div>
      </div>
      <div class="card">
        <h2>History</h2>
        <div id="history"></div>
      </div>
    </section>

    <!-- ---- Settings ---- -->
    <section id="settings" class="page" hidden>
      <div class="card">
        <h2>Goals</h2>
        <form id="settingsForm">
          <input id="age" type="number" placeholder="Age">
          <input id="height" type="number" placeholder="Height cm">
          <input id="goalCal" type="number" placeholder="Calories">
          <input id="goalP" type="number" placeholder="Protein g">
          <input id="goalC" type="number" placeholder="Carbs g">
          <input id="goalF" type="number" placeholder="Fat g">
          <input id="goalSteps" type="number" placeholder="Steps">
          <button>Save</button>
        </form>
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
